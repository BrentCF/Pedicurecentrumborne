document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCos }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Cosmetische pedicure\" style=\"max-width:1160px;margin:0 auto;padding:64px 24px;\">\n        <p style=\"margin:0 0 10px;color:#2E5E4E;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700;\">Verzorging &amp; ontspanning<\u002Fp>\n        <h1 style=\"font-size:clamp(26px,3.6vw,38px);margin:0 0 14px;color:#1F3D32;\">Cosmetische pedicure<\u002Fh1>\n        <p style=\"max-width:34em;color:#55524B;margin:0 0 40px;font-size:19px;\">Verzorgde voeten lopen prettiger. Een cosmetische behandeling houdt nagels en huid gezond en is bovendien een moment van ontspanning.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:20px;max-width:780px;\">\n          <sc-for list=\"{{ cosTreats }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;padding:30px;box-shadow:0 1px 2px rgba(31,61,50,.05);\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline;\">\n                <h2 style=\"margin:0;font-size:19px;color:#1F3D32;\">{{ t.n }}<\u002Fh2>\n                <span style=\"color:#2E5E4E;font-size:17px;font-weight:700;white-space:nowrap;\">{{ t.m }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:10px 0 14px;color:#55524B;max-width:34em;\">{{ t.d }}<\u002Fp>\n              <ul style=\"margin:0 0 18px;padding-left:22px;display:flex;flex-direction:column;gap:5px;color:#55524B;\">\n                <sc-for list=\"{{ t.pts }}\" as=\"p\" hint-placeholder-count=\"3\"><li>{{ p.t }}<\u002Fli><\u002Fsc-for>\n              <\u002Ful>\n              <button sc-camel-on-click=\"{{ go.afspraak }}\" style=\"background:#2E5E4E;color:#fff;border:none;border-radius:999px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;\" style-hover=\"background:#24493D;\">Afspraak maken<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <section style=\"margin-top:48px;\">\n          <h2 style=\"margin:0 0 20px;font-size:21px;color:#1F3D32;\">Goed om te weten<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:900px;\">\n            <sc-for list=\"{{ cosWeten }}\" as=\"w\" hint-placeholder-count=\"3\">\n              <div style=\"background:#EAF1ED;border-radius:16px;padding:24px;\">\n                <p style=\"margin:0 0 6px;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;color:#1F3D32;\">{{ w.t }}<\u002Fp>\n                <p style=\"margin:0;color:#3D4A43;font-size:17px;\">{{ w.d }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMed }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Medische pedicure\" style=\"max-width:1160px;margin:0 auto;padding:64px 24px;\">\n        <p style=\"margin:0 0 10px;color:#2E5E4E;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700;\">Medische voetzorg<\u002Fp>\n        <h1 style=\"font-size:clamp(26px,3.6vw,38px);margin:0 0 14px;color:#1F3D32;\">Medische pedicure<\u002Fh1>\n        <p style=\"max-width:34em;color:#55524B;margin:0 0 40px;font-size:19px;\">Medische voetzorg is er voor voeten die extra aandacht nodig hebben: bij diabetes, reuma, ingegroeide nagels of hardnekkig eelt. U kunt zonder verwijzing een afspraak maken.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:56px;\">\n          <sc-for list=\"{{ medCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ c.on }}\" style=\"text-align:left;background:#fff;border:1px solid #E9E2D3;border-radius:18px;padding:26px;box-shadow:0 1px 2px rgba(31,61,50,.05);cursor:pointer;display:flex;flex-direction:column;gap:8px;font-size:17px;transition:box-shadow .15s ease,transform .15s ease;\" style-hover=\"transform:translateY(-3px);box-shadow:0 12px 28px rgba(31,61,50,.12);\">\n              <span style=\"font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;color:#1F3D32;\">{{ c.t }}<\u002Fspan>\n              <span style=\"color:#55524B;\">{{ c.d }}<\u002Fspan>\n              <span style=\"color:#2E5E4E;font-weight:700;margin-top:4px;\">Lees meer →<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <section style=\"margin-bottom:56px;\">\n          <h2 style=\"margin:0 0 24px;font-size:21px;color:#1F3D32;\">Zo verloopt uw eerste afspraak<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;\">\n            <sc-for list=\"{{ medStappen }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:16px;padding:26px;\">\n                <div style=\"width:40px;height:40px;border-radius:50%;background:#2E5E4E;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-bottom:12px;\">{{ s.n }}<\u002Fdiv>\n                <p style=\"margin:0 0 6px;font-family:'Outfit',sans-serif;font-size:19px;font-weight:700;color:#1F3D32;\">{{ s.t }}<\u002Fp>\n                <p style=\"margin:0;color:#55524B;font-size:17px;\">{{ s.d }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"background:#1F3D32;border-radius:22px;padding:44px 40px;margin-bottom:24px;color:#fff;\">\n          <h2 style=\"margin:0 0 14px;font-size:clamp(20px,2.6vw,26px);color:#fff;\">Vergoeding door de zorgverzekeraar<\u002Fh2>\n          <p style=\"margin:0 0 22px;max-width:36em;color:rgba(255,255,255,.85);\">Bij diabetes of reuma wordt medische voetzorg vaak (deels) vergoed. Dat loopt via een verwijzing van de podotherapeut of huisarts. Onze KRP-registratie (Kwaliteitsregister voor Pedicures) is daarbij een voorwaarde — die hebben we.<\u002Fp>\n          <h3 style=\"margin:0 0 14px;font-size:19px;color:#D8C9A3;\">Zo checkt u uw polis<\u002Fh3>\n          <ol style=\"margin:0 0 22px;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:34em;color:rgba(255,255,255,.9);\">\n            <li>Kijk in uw polis onder \"voetzorg\" of \"pedicure bij diabetes of reuma\".<\u002Fli>\n            <li>Vraag uw huisarts of podotherapeut om een verwijzing met zorgprofiel.<\u002Fli>\n            <li>Neem de verwijzing mee naar uw eerste afspraak — wij regelen de rest.<\u002Fli>\n          <\u002Fol>\n          <p style=\"margin:0;font-weight:600;\">Twijfelt u? Bel gerust: <a href=\"tel:+31742661234\" style=\"color:#D8C9A3;\">074 266 1234<\u002Fa>.<\u002Fp>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSub }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Medisch subpagina\" style=\"max-width:1160px;margin:0 auto;padding:56px 24px;\">\n        <div style=\"max-width:780px;\">\n        <button sc-camel-on-click=\"{{ go.medisch }}\" style=\"background:none;border:none;cursor:pointer;color:#2E5E4E;font-size:17px;font-weight:600;padding:8px 0;margin-bottom:8px;\" style-hover=\"text-decoration:underline;\">← Medische pedicure<\u002Fbutton>\n        <h1 style=\"font-size:clamp(26px,3.6vw,36px);margin:0 0 26px;color:#1F3D32;\">{{ sub.title }}<\u002Fh1>\n        <h2 style=\"font-size:23px;margin:0 0 10px;color:#1F3D32;\">Herkent u dit?<\u002Fh2>\n        <p style=\"margin:0 0 12px;color:#55524B;\">{{ sub.klacht }}<\u002Fp>\n        <ul style=\"margin:0 0 30px;padding-left:22px;display:flex;flex-direction:column;gap:6px;\">\n          <sc-for list=\"{{ sub.punten }}\" as=\"p\" hint-placeholder-count=\"3\"><li>{{ p.t }}<\u002Fli><\u002Fsc-for>\n        <\u002Ful>\n        <h2 style=\"font-size:23px;margin:0 0 10px;color:#1F3D32;\">De behandeling<\u002Fh2>\n        <p style=\"margin:0 0 30px;color:#55524B;\">{{ sub.behandeling }}<\u002Fp>\n        <h2 style=\"font-size:23px;margin:0 0 10px;color:#1F3D32;\">Het resultaat<\u002Fh2>\n        <p style=\"margin:0 0 30px;color:#55524B;\">{{ sub.resultaat }}<\u002Fp>\n        <div style=\"background:#EAF1ED;border-radius:16px;padding:26px;margin-bottom:34px;display:flex;flex-direction:column;gap:8px;\">\n          <p style=\"margin:0;\"><strong>Duur:<\u002Fstrong> {{ sub.duur }}<\u002Fp>\n          <p style=\"margin:0;\"><strong>Prijs:<\u002Fstrong> {{ sub.prijs }}<\u002Fp>\n          <p style=\"margin:0;\"><strong>Vergoeding:<\u002Fstrong> {{ sub.verg }}<\u002Fp>\n        <\u002Fdiv>\n        <h2 style=\"font-size:23px;margin:0 0 16px;color:#1F3D32;\">Veelgestelde vragen<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:40px;\">\n          <sc-for list=\"{{ sub.faqs }}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:14px;\">\n              <button sc-camel-on-click=\"{{ f.on }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:17px 20px;font-size:18px;font-weight:600;display:flex;justify-content:space-between;gap:12px;min-height:48px;color:#1F3D32;\">{{ f.q }}<span style=\"color:#2E5E4E;font-size:22px;line-height:1;\">{{ f.ch }}<\u002Fspan><\u002Fbutton>\n              <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 20px 18px;color:#55524B;\">{{ f.a }}<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#1F3D32;border-radius:18px;padding:32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;\">\n          <p style=\"margin:0;color:#fff;font-size:17px;font-weight:600;font-family:'Outfit',sans-serif;\">Last van uw voeten? Wacht er niet mee.<\u002Fp>\n          <button sc-camel-on-click=\"{{ go.afspraak }}\" style=\"background:#FAF6EF;color:#1F3D32;border:none;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;min-height:48px;\" style-hover=\"background:#fff;\">Afspraak maken<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTar }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Tarieven\" style=\"max-width:1160px;margin:0 auto;padding:64px 24px;\">\n        <div style=\"max-width:780px;\">\n        <p style=\"margin:0 0 10px;color:#2E5E4E;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700;\">Duidelijk vooraf<\u002Fp>\n        <h1 style=\"font-size:clamp(26px,3.6vw,38px);margin:0 0 36px;color:#1F3D32;\">Tarieven<\u002Fh1>\n        <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;margin-bottom:24px;overflow:hidden;\">\n          <h2 style=\"margin:0;padding:18px 26px;font-size:20px;background:#F2EDE1;border-bottom:1px solid #E9E2D3;color:#1F3D32;\">Cosmetisch<\u002Fh2>\n          <sc-for list=\"{{ cosRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:16px;padding:15px 26px;border-bottom:1px solid #F2EDE1;align-items:baseline;\">\n              <span>{{ r.b }}<\u002Fspan><span style=\"color:#8A8375;font-size:16px;\">{{ r.d }}<\u002Fspan><span style=\"font-weight:700;min-width:76px;text-align:right;color:#1F3D32;\">{{ r.p }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;margin-bottom:28px;overflow:hidden;\">\n          <h2 style=\"margin:0;padding:18px 26px;font-size:20px;background:#F2EDE1;border-bottom:1px solid #E9E2D3;color:#1F3D32;\">Medisch<\u002Fh2>\n          <sc-for list=\"{{ medRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:16px;padding:15px 26px;border-bottom:1px solid #F2EDE1;align-items:baseline;\">\n              <span>{{ r.b }}<\u002Fspan><span style=\"color:#8A8375;font-size:16px;\">{{ r.d }}<\u002Fspan><span style=\"font-weight:700;min-width:76px;text-align:right;color:#1F3D32;\">{{ r.p }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 8px;color:#55524B;\">U kunt pinnen of contant betalen.<\u002Fp>\n        <p style=\"margin:0 0 32px;color:#55524B;\">Medische voetzorg wordt bij diabetes of reuma vaak vergoed — <button sc-camel-on-click=\"{{ go.medisch }}\" style=\"background:none;border:none;cursor:pointer;color:#2E5E4E;font-size:18px;padding:0;text-decoration:underline;\">lees hoe dat werkt<\u002Fbutton>.<\u002Fp>\n        <button sc-camel-on-click=\"{{ go.afspraak }}\" style=\"background:#2E5E4E;color:#fff;border:none;border-radius:999px;padding:13px 26px;font-size:16px;font-weight:600;cursor:pointer;min-height:52px;\" style-hover=\"background:#24493D;\">Afspraak maken<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isOver }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Over ons\" style=\"max-width:1160px;margin:0 auto;padding:64px 24px;\">\n        <div style=\"max-width:880px;\">\n        <p style=\"margin:0 0 10px;color:#2E5E4E;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700;\">De praktijk<\u002Fp>\n        <h1 style=\"font-size:clamp(26px,3.6vw,38px);margin:0 0 28px;color:#1F3D32;\">Over Pedicurecentrum Borne<\u002Fh1>\n        <div style=\"height:360px;margin-bottom:36px;\"><image-slot id=\"over-praktijk\" placeholder=\"foto: de praktijkruimte\" radius=\"18\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"max-width:660px;display:flex;flex-direction:column;gap:16px;margin-bottom:44px;\">\n          <p style=\"margin:0;\">Voeten dragen u een leven lang, maar krijgen zelden aandacht — tot ze pijn doen. Dat is waarom dit vak zo mooi is: iemand die met pijn binnenkomt, loopt een uur later weer gewoon naar buiten.<\u002Fp>\n          <p style=\"margin:0;\">De praktijk zit aan de Aanslagweg in Borne, met gratis parkeren voor de deur. Veel cliënten komen uit Borne zelf, maar ook uit Hertme, Zenderen en Bornerbroek weten ze de praktijk te vinden.<\u002Fp>\n          <p style=\"margin:0;\">De werkwijze is eenvoudig: rustig de tijd nemen, eerst kijken en luisteren, dan behandelen. Geen behandeling zonder uitleg, en bij medische bijzonderheden korte lijnen met podotherapeut en huisarts.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;padding:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;align-items:center;margin-bottom:32px;\">\n          <div style=\"height:260px;\"><image-slot id=\"over-meike\" placeholder=\"foto: Meike\" radius=\"14\"><\u002Fimage-slot><\u002Fdiv>\n          <div>\n            <h2 style=\"margin:0 0 8px;font-size:21px;color:#1F3D32;\">Meike<\u002Fh2>\n            <p style=\"margin:0 0 8px;color:#2E5E4E;font-weight:700;\">Medisch pedicure<\u002Fp>\n            <p style=\"margin:0;color:#55524B;\">Gediplomeerd medisch pedicure, gespecialiseerd in de diabetische en reumatische voet en nagelbeugeltechniek. Geregistreerd in het KRP.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;padding:32px;margin-bottom:32px;\">\n          <h2 style=\"margin:0 0 18px;font-size:19px;color:#1F3D32;\">Diploma's en registraties<\u002Fh2>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n            <span style=\"border:1px solid #DCD4C2;border-radius:999px;padding:11px 22px;font-weight:600;color:#55524B;\">ProVoet<\u002Fspan>\n            <span style=\"border:1px solid #DCD4C2;border-radius:999px;padding:11px 22px;font-weight:600;color:#55524B;\">KRP / ProCERT<\u002Fspan>\n            <span style=\"border:1px solid #DCD4C2;border-radius:999px;padding:11px 22px;font-weight:600;color:#55524B;\">Medisch pedicure<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;\">\n          <div style=\"height:200px;\"><image-slot id=\"grid-1\" placeholder=\"foto: behandelstoel\" radius=\"14\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"height:200px;\"><image-slot id=\"grid-2\" placeholder=\"foto: instrumenten\" radius=\"14\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"height:200px;\"><image-slot id=\"grid-3\" placeholder=\"foto: wachtruimte\" radius=\"14\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAfs }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Afspraak maken\" style=\"max-width:1160px;margin:0 auto;padding:64px 24px;\">\n        <p style=\"margin:0 0 10px;color:#2E5E4E;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700;\">Online of telefonisch<\u002Fp>\n        <h1 style=\"font-size:clamp(26px,3.6vw,38px);margin:0 0 36px;color:#1F3D32;\">Afspraak maken<\u002Fh1>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start;margin-bottom:24px;\">\n          <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;padding:32px;box-shadow:0 1px 2px rgba(31,61,50,.05);\">\n            <div style=\"display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap;\">\n              <sc-for list=\"{{ bkSteps }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:8px;\">\n ;cursor:pointer;font-size:18px;color:#1F3D32;\" style-hover=\"background:#F0EADC;\">‹<\u002Fbutton>\n                  <span style=\"font-weight:700;color:#1F3D32;\">{{ calLabel }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ calNext }}\" aria-label=\"Volgende maand\" style=\"background:none;border:1px solid #E9E2D3;border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:18px;color:#1F3D32;\" style-hover=\"background:#F0EADC;\">›<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;\">\n                  <sc-for list=\"{{ calDows }}\" as=\"w\" hint-placeholder-count=\"7\">\n                    <span style=\"text-align:center;font-size:13px;font-weight:700;color:#8A8375;text-transform:uppercase;letter-spacing:.04em;\">{{ w.l }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;\">\n                  <sc-for list=\"{{ calCells }}\" as=\"c\" hint-placeholder-count=\"35\">\n                    <button sc-camel-on-click=\"{{ c.on }}\" disabled=\"{{ c.dis }}\" style=\"border:none;border-radius:10px;min-height:42px;font-size:16px;font-weight:600;background:{{ c.bg }};color:{{ c.c }};cursor:{{ c.cur }};\">{{ c.d }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0 0 10px;font-weight:600;\">Tijd<\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n                <sc-for list=\"{{ bkTimes }}\" as=\"d\" hint-placeholder-count=\"6\">\n                  <button sc-camel-on-click=\"{{ d.on }}\" style=\"cursor:pointer;border-radius:999px;padding:12px 18px;font-size:16px;font-weight:600;border:2px solid {{ d.bc }};background:{{ d.bg }};min-height:48px;\">{{ d.l }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ st2 }}\" hint-placeholder-val=\"{{ false }}\">\n              <h2 style=\"margin:0 0 16px;font-size:19px;color:#1F3D32;\">Uw gegevens<\u002Fh2>\n              <label style=\"display:block;font-weight:600;margin-bottom:6px;\" for=\"bk-naam\">Naam<\u002Flabel>\n              <input id=\"bk-naam\" value=\"{{ bkNaam }}\" sc-camel-on-change=\"{{ onNaam }}\" style=\"width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid #DCD4C2;border-radius:10px;margin-bottom:16px;background:#fff;\">\n              <label style=\"display:block;font-weight:600;margin-bottom:6px;\" for=\"bk-tel\">Telefoonnummer<\u002Flabel>\n              <input id=\"bk-tel\" value=\"{{ bkTel }}\" sc-camel-on-change=\"{{ onTel }}\" type=\"tel\" style=\"width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid #DCD4C2;border-radius:10px;background:#fff;\">\n              <p style=\"margin:16px 0 0;color:#8A8375;font-size:15px;\">Door te boeken gaat u akkoord met onze <button sc-camel-on-click=\"{{ go.voorwaarden }}\" style=\"background:none;border:none;cursor:pointer;color:#2E5E4E;font-size:15px;padding:0;text-decoration:underline;\">algemene voorwaarden<\u002Fbutton>.<\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ st3 }}\" hint-placeholder-val=\"{{ false }}\">\n              <h2 style=\"margin:0 0 12px;font-size:19px;color:#1F3D32;\">Uw afspraak is aangevraagd<\u002Fh2>\n              <p style=\"margin:0 0 12px;color:#55524B;\">{{ bkSummary }}<\u002Fp>\n              <p style=\"margin:0 0 20px;color:#55524B;\">U ontvangt een bevestiging per e-mail, daarin kunt u de afspraak ook verzetten of annuleren.<\u002Fp>\n              <button sc-camel-on-click=\"{{ bkReset }}\" style=\"background:none;border:1px solid #DCD4C2;border-radius:999px;padding:12px 22px;font-size:17px;font-weight:600;cursor:pointer;min-height:48px;\" style-hover=\"background:#F0EADC;\">Nog een afspraak maken<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasErr }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:16px 0 0;color:#A0492E;font-weight:600;\">{{ bkErr }}<\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ bkNav }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;gap:12px;margin-top:26px;\">\n                <sc-if value=\"{{ canBack }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ bkBack }}\" style=\"background:none;border:1px solid #DCD4C2;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;min-height:48px;\" style-hover=\"background:#F0EADC;\">Terug<\u002Fbutton>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ bkNext }}\" style=\"background:#2E5E4E;color:#fff;border:none;border-radius:999px;padding:11px 24px;font-size:15px;font-weight:600;cursor:pointer;min-height:48px;\" style-hover=\"background:#24493D;\">{{ bkNextLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"background:#1F3D32;border-radius:18px;padding:32px;color:#fff;\">\n            <h2 style=\"margin:0 0 12px;font-size:19px;color:#fff;\">Liever bellen of appen?<\u002Fh2>\n            <p style=\"margin:0 0 18px;color:rgba(255,255,255,.8);\">Dat kan natuurlijk ook. We nemen op tussen 8:30 en 17:00.<\u002Fp>\n            <a href=\"tel:+31742661234\" style=\"display:block;font-family:'Outfit',sans-serif;font-size:30px;font-weight:700;text-decoration:none;margin-bottom:22px;color:#D8C9A3;\">074 266 1234<\u002Fa>\n            <a href=\"https://wa.me/31742661234\" style=\"display:inline-flex;align-items:center;gap:10px;background:#FAF6EF;color:#1F3D32;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:700;text-decoration:none;min-height:48px;box-sizing:border-box;\" style-hover=\"background:#fff;color:#1F3D32;\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.6 8.6 0 0 1-3.9-.9L3 21l2-5.4a8.3 8.3 0 0 1-1-4A8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z\"><\u002Fpath><\u002Fsvg>\n              Stuur een WhatsApp\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;color:#55524B;\">Verhinderd? Zeg uiterlijk 24 uur van tevoren af, dan brengen we niets in rekening.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCon }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Contact\" style=\"max-width:1160px;margin:0 auto;padding:64px 24px;\">\n        <p style=\"margin:0 0 10px;color:#2E5E4E;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700;\">We horen graag van u<\u002Fp>\n        <h1 style=\"font-size:clamp(26px,3.6vw,38px);margin:0 0 36px;color:#1F3D32;\">Contact<\u002Fh1>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start;\">\n          <div style=\"display:flex;flex-direction:column;gap:24px;\">\n            <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;padding:32px;\">\n              <h2 style=\"margin:0 0 8px;font-size:19px;color:#1F3D32;\">Bezoekadres<\u002Fh2>\n              <p style=\"margin:0 0 4px;\">Aanslagweg 16C, Borne<\u002Fp>\n              <p style=\"margin:0 0 18px;\"><a href=\"tel:+31742661234\">074 266 1234<\u002Fa><\u002Fp>\n              <h3 style=\"margin:0 0 10px;font-size:18px;color:#1F3D32;\">Openingstijden<\u002Fh3>\n              <div style=\"display:flex;flex-direction:column;gap:4px;margin-bottom:18px;\">\n                <sc-for list=\"{{ hours }}\" as=\"h\" hint-placeholder-count=\"7\">\n                  <div style=\"display:flex;justify-content:space-between;gap:16px;max-width:320px;\"><span>{{ h.d }}<\u002Fspan><span style=\"color:#55524B;\">{{ h.t }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"margin:0;color:#55524B;\">Gratis parkeren voor de deur. De praktijk is op de begane grond en toegankelijk met rollator of rolstoel.<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"height:220px;\"><image-slot id=\"contact-kaart\" placeholder=\"statische kaart: Aanslagweg 16C, Borne\" radius=\"16\"><\u002Fimage-slot><\u002Fdiv>\n              <a href=\"https://www.google.com/maps/search/Aanslagweg+16C+Borne\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:10px;font-size:15px;font-weight:600;\">Route via Google Maps →<\u002Fa>\n            <\u002Fdiv>\n            <div style=\"height:200px;\"><image-slot id=\"contact-ingang\" placeholder=\"foto: de ingang van de praktijk\" radius=\"16\"><\u002Fimage-slot><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;padding:32px;\">\n            <h2 style=\"margin:0 0 16px;font-size:19px;color:#1F3D32;\">Stuur een bericht<\u002Fh2>\n            <sc-if value=\"{{ conSent }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#EAF1ED;border-radius:14px;padding:22px;\">\n                <p style=\"margin:0;font-weight:700;color:#1F3D32;\">Dank voor uw bericht.<\u002Fp>\n                <p style=\"margin:8px 0 0;color:#3D4A43;\">We nemen binnen één werkdag contact met u op.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ conNotSent }}\" hint-placeholder-val=\"{{ true }}\">\n              <form sc-camel-on-submit=\"{{ conSubmit }}\" style=\"display:flex;flex-direction:column;gap:16px;\">\n                <div>\n                  <label style=\"display:block;font-weight:600;margin-bottom:6px;\" for=\"con-naam\">Naam<\u002Flabel>\n                  <input id=\"con-naam\" required=\"required\" style=\"width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid #DCD4C2;border-radius:10px;\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"display:block;font-weight:600;margin-bottom:6px;\" for=\"con-tel\">Telefoon of e-mail<\u002Flabel>\n                  <input id=\"con-tel\" required=\"required\" style=\"width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid #DCD4C2;border-radius:10px;\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"display:block;font-weight:600;margin-bottom:6px;\" for=\"con-msg\">Bericht<\u002Flabel>\n                  <textarea id=\"con-msg\" required=\"required\" rows=\"5\" style=\"width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid #DCD4C2;border-radius:10px;resize:vertical;\"><\u002Ftextarea>\n                <\u002Fdiv>\n                <button type=\"submit\" style=\"align-self:flex-start;background:#2E5E4E;color:#fff;border:none;border-radius:999px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer;min-height:50px;\" style-hover=\"background:#24493D;\">Versturen<\u002Fbutton>\n                <p style=\"margin:0;color:#8A8375;font-size:15px;\">Wij gebruiken uw gegevens alleen om te reageren — zie onze <button sc-camel-on-click=\"{{ go.privacy }}\" style=\"background:none;border:none;cursor:pointer;color:#2E5E4E;font-size:15px;padding:0;text-decoration:underline;\">privacyverklaring<\u002Fbutton>.<\u002Fp>\n              <\u002Fform>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isShop }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Webshop\" style=\"max-width:1160px;margin:0 auto;padding:64px 24px;\">\n        <p style=\"margin:0 0 10px;color:#2E5E4E;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700;\">Afhalen in de praktijk<\u002Fp>\n        <h1 style=\"font-size:clamp(26px,3.6vw,38px);margin:0 0 14px;color:#1F3D32;\">Webshop<\u002Fh1>\n        <p style=\"max-width:34em;color:#55524B;margin:0 0 40px;font-size:19px;\">Een kleine selectie producten die we zelf gebruiken en aanraden. U bestelt online, haalt af in de praktijk en betaalt daar — pin of contant.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start;\">\n          <div style=\"display:flex;flex-direction:column;gap:20px;\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;\">\n              <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;\">\n                  <div style=\"height:150px;\"><image-slot id=\"{{ p.img }}\" shape=\"rect\" placeholder=\"{{ p.ph }}\"><\u002Fimage-slot><\u002Fdiv>\n                  <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px;flex:1;\">\n                    <span style=\"font-family:'Outfit',sans-serif;font-size:19px;font-weight:700;color:#1F3D32;\">{{ p.n }}<\u002Fspan>\n                    <span style=\"color:#55524B;font-size:16px;flex:1;\">{{ p.d }}<\u002Fspan>\n                    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;\">\n                      <span style=\"font-weight:700;color:#1F3D32;\">{{ p.prF }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ p.on }}\" style=\"background:#2E5E4E;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-size:16px;font-weight:600;cursor:pointer;min-height:44px;\" style-hover=\"background:#24493D;\">In winkelmand<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:#1F3D32;border-radius:18px;padding:28px;color:#fff;\">\n              <h2 style=\"margin:0 0 8px;font-size:19px;color:#fff;\">Cadeaukaart<\u002Fh2>\n              <p style=\"margin:0 0 16px;color:rgba(255,255,255,.8);max-width:32em;\">Geef een verzorgd moment cadeau. Kies zelf het bedrag, vanaf € 25,00. In te leveren bij elke behandeling.<\u002Fp>\n              <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center;\">\n                <label for=\"gift-amt\" style=\"font-weight:600;\">Bedrag €<\u002Flabel>\n                <input id=\"gift-amt\" type=\"number\" min=\"25\" step=\"5\" value=\"{{ giftAmt }}\" sc-camel-on-change=\"{{ onGiftAmt }}\" style=\"width:110px;box-sizing:border-box;padding:11px 14px;border:1px solid rgba(255,255,255,.4);border-radius:10px;background:#fff;color:#1F3D32;font-weight:700;\">\n                <button sc-camel-on-click=\"{{ giftAdd }}\" style=\"background:#FAF6EF;color:#1F3D32;border:none;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;min-height:46px;\" style-hover=\"background:#fff;\">In winkelmand<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #E9E2D3;border-radius:18px;padding:28px;\">\n            <h2 style=\"margin:0 0 16px;font-size:19px;color:#1F3D32;\">Winkelmand ({{ cartCount }})<\u002Fh2>\n            <sc-if value=\"{{ shop0 }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-if value=\"{{ hasCart }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px;\">\n                  <sc-for list=\"{{ cartRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;align-items:center;gap:10px;border-bottom:1px solid #F2EDE1;padding-bottom:10px;flex-wrap:wrap;\">\n                      <div style=\"display:flex;align-items:center;gap:4px;\">\n                        <button sc-camel-on-click=\"{{ r.onMin }}\" aria-label=\"Minder\" style=\"background:none;border:1px solid #DCD4C2;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:17px;font-weight:700;color:#1F3D32;\" style-hover=\"background:#F0EADC;\">−<\u002Fbutton>\n                        <span style=\"min-width:26px;text-align:center;font-weight:700;color:#1F3D32;\">{{ r.q }}<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ r.onPlus }}\" aria-label=\"Meer\" style=\"background:none;border:1px solid #DCD4C2;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:17px;font-weight:700;color:#1F3D32;\" style-hover=\"background:#F0EADC;\">+<\u002Fbutton>\n                      <\u002Fdiv>\n                      <span style=\"flex:1;\">{{ r.n }}<\u002Fspan>\n                      <span style=\"font-weight:700;color:#1F3D32;\">{{ r.tot }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ r.onDel }}\" aria-label=\"Verwijderen\" style=\"background:none;border:none;cursor:pointer;color:#A0492E;font-size:19px;padding:6px;min-width:34px;\">✕<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;font-weight:700;font-size:19px;color:#1F3D32;margin-bottom:20px;\"><span>Totaal<\u002Fspan><span>{{ cartTotal }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-if>\n              <p style=\"margin:0 0 16px;color:#55524B;font-size:16px;\">U rekent af bij het afhalen in de praktijk — pin of contant.<\u002Fp>\n              <button sc-camel-on-click=\"{{ shopNext }}\" style=\"width:100%;background:#2E5E4E;color:#fff;border:none;border-radius:999px;padding:14px;font-size:17px;font-weight:600;cursor:pointer;min-height:50px;\" style-hover=\"background:#24493D;\">{{ shopNextLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ shop1 }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0 0 16px;color:#55524B;\">Bijna klaar. We leggen uw bestelling klaar en laten weten wanneer u deze kunt afhalen.<\u002Fp>\n              <label style=\"display:block;font-weight:600;margin-bottom:6px;\" for=\"shop-naam\">Naam<\u002Flabel>\n              <input id=\"shop-naam\" value=\"{{ shopNaam }}\" sc-camel-on-change=\"{{ onShopNaam }}\" style=\"width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid #DCD4C2;border-radius:10px;margin-bottom:16px;\">\n              <label style=\"display:block;font-weight:600;margin-bottom:6px;\" for=\"shop-tel\">Telefoonnummer<\u002Flabel>\n              <input id=\"shop-tel\" type=\"tel\" value=\"{{ shopTel }}\" sc-camel-on-change=\"{{ onShopTel }}\" style=\"width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid #DCD4C2;border-radius:10px;margin-bottom:16px;\">\n              <label style=\"display:block;font-weight:600;margin-bottom:6px;\" for=\"shop-mail\">E-mailadres<\u002Flabel>\n              <input id=\"shop-mail\" type=\"email\" value=\"{{ shopMail }}\" sc-camel-on-change=\"{{ onShopMail }}\" style=\"width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid #DCD4C2;border-radius:10px;margin-bottom:20px;\">\n              <p style=\"margin:0 0 10px;font-weight:600;\">Afhaaldag <span style=\"color:#8A8375;font-weight:400;font-size:15px;\">(minimaal 24 uur vooruit)<\u002Fspan><\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;\">\n                <sc-for list=\"{{ shopDates }}\" as=\"d\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ d.on }}\" style=\"cursor:pointer;border-radius:999px;padding:11px 16px;font-size:15px;font-weight:600;border:2px solid {{ d.bc }};background:{{ d.bg }};min-height:44px;\">{{ d.l }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"margin:0 0 10px;font-weight:600;\">Afhaaltijd<\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;\">\n                <sc-for list=\"{{ shopTimes }}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ d.on }}\" style=\"cursor:pointer;border-radius:999px;padding:11px 18px;font-size:15px;font-weight:600;border:2px solid {{ d.bc }};background:{{ d.bg }};min-height:44px;\">{{ d.l }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;\">\n                <button sc-camel-on-click=\"{{ shopBack }}\" style=\"background:none;border:1px solid #DCD4C2;border-radius:999px;padding:12px 20px;font-size:16px;font-weight:600;cursor:pointer;min-height:48px;\" style-hover=\"background:#F0EADC;\">Terug<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ shopNext }}\" style=\"flex:1;background:#2E5E4E;color:#fff;border:none;border-radius:999px;padding:12px;font-size:16px;font-weight:600;cursor:pointer;min-height:48px;\" style-hover=\"background:#24493D;\">{{ shopNextLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ shop2 }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#EAF1ED;border-radius:14px;padding:22px;margin-bottom:16px;\">\n                <p style=\"margin:0 0 8px;font-weight:700;color:#1F3D32;\">Dank voor uw bestelling.<\u002Fp>\n                <p style=\"margin:0;color:#3D4A43;\">Uw bestelling ligt klaar op {{ shopMoment }} aan de Aanslagweg 16C. U betaalt bij het afhalen ({{ cartTotal }}) — pin of contant. U ontvangt een bevestiging per e-mail.<\u002Fp>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ shopReset }}\" style=\"background:none;border:1px solid #DCD4C2;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer;min-height:48px;\" style-hover=\"background:#F0EADC;\">Verder winkelen<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasShopErr }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:16px 0 0;color:#A0492E;font-weight:600;\">{{ shopErr }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPriv }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Privacyverklaring\" style=\"max-width:1160px;margin:0 auto;padding:64px 24px;\">\n        <div style=\"max-width:680px;display:flex;flex-direction:column;gap:8px;\">\n          <h1 style=\"font-size:clamp(26px,3.6vw,38px);margin:0 0 6px;color:#1F3D32;\">Privacyverklaring<\u002Fh1>\n          <p style=\"margin:0 0 24px;color:#8A8375;font-size:15px;\">Laatst gewijzigd: 10 augustus 2026<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:12px 0 4px;\">Wie wij zijn<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Pedicurecentrum Borne, Aanslagweg 16C in Borne. KvK 87654321. Telefoon 074 266 1234, e-mail info@pedicurecentrumborne.nl.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">Welke gegevens wij verwerken en waarom<\u002Fh2>\n          <p style=\"margin:0 0 8px;color:#55524B;\"><strong>Afspraakgegevens<\u002Fstrong> — via het online boekingssysteem en telefoon verwerken wij uw naam, telefoonnummer, e-mailadres en de gekozen behandeling. Dat is nodig om de afspraak uit te voeren.<\u002Fp>\n          <p style=\"margin:0 0 8px;color:#55524B;\"><strong>Contactformulier<\u002Fstrong> — uw naam en contactgegevens gebruiken wij alleen om te reageren op uw bericht.<\u002Fp>\n          <p style=\"margin:0;color:#55524B;\"><strong>Behandelgegevens<\u002Fstrong> — in het klantdossier leggen wij gegevens over uw voetgezondheid vast, alleen in onze beveiligde salonsoftware. Dit is nodig voor verantwoorde (medische) voetzorg.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">Met wie wij gegevens delen<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Ons boekings- en dossiersysteem (Salonized) verwerkt gegevens namens ons als verwerker; daarvoor is een verwerkersovereenkomst gesloten. Wij verkopen uw gegevens nooit aan derden.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">Hoelang wij bewaren<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Afspraak- en dossiergegevens bewaren wij zolang u cliënt bent en daarna volgens de wettelijke (fiscale) bewaartermijnen.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">Uw rechten<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">U heeft recht op inzage, correctie, verwijdering en bezwaar. Neem daarvoor contact met ons op. Een klacht indienen kan bij de Autoriteit Persoonsgegevens.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">Cookies<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Deze website gebruikt alleen functionele cookies en cookieloze bezoekersstatistieken. Wij plaatsen geen volgcookies en tonen daarom geen cookiemelding.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">Geautomatiseerde besluitvorming<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Wij nemen geen besluiten op basis van geautomatiseerde verwerking.<\u002Fp>\n          <!-- Developer-noot: indien later marketing-pixels of embeds (bijv. YouTube, live Google Maps) worden toegevoegd, is alsnog een cookiebanner met vooraf-toestemming verplicht. -->\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isVw }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Algemene voorwaarden\" style=\"max-width:1160px;margin:0 auto;padding:64px 24px;\">\n        <div style=\"max-width:680px;display:flex;flex-direction:column;gap:8px;\">\n          <h1 style=\"font-size:clamp(26px,3.6vw,38px);margin:0 0 24px;color:#1F3D32;\">Algemene voorwaarden<\u002Fh1>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:12px 0 4px;\">1. Toepasselijkheid<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Deze voorwaarden gelden voor alle behandelingen en boekingen bij Pedicurecentrum Borne.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">2. Afspraken en annulering<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Afzeggen kan kosteloos tot 24 uur van tevoren. Daarna, of bij niet verschijnen, wordt de gereserveerde tijd in rekening gebracht.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">3. Betaling<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Alle prijzen zijn inclusief btw. Betaling gebeurt direct na de behandeling, per pin of contant.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">4. Uw gezondheidsinformatie<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">U informeert de pedicure juist en volledig over uw gezondheid (onder andere diabetes, reuma en medicijngebruik). De praktijk is niet aansprakelijk voor gevolgen van onjuiste of onvolledige informatie.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">5. Nazorg<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Heeft u binnen 7 dagen na de behandeling klachten? Neem contact op — u kunt kosteloos terugkomen voor een herbeoordeling.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">6. Privacy<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Wij gaan zorgvuldig om met uw gegevens. Zie onze <button sc-camel-on-click=\"{{ go.privacy }}\" style=\"background:none;border:none;cursor:pointer;color:#2E5E4E;font-size:16px;padding:0;text-decoration:underline;\">privacyverklaring<\u002Fbutton>.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">7. Aansprakelijkheid<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Onze aansprakelijkheid is beperkt tot het bedrag van de behandeling. De praktijk is niet aansprakelijk voor verlies van eigendommen.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">8. Klachten<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Meld een klacht eerst bij de praktijk; we zoeken samen naar een oplossing. Wij zijn aangesloten bij ProVoet.<\u002Fp>\n          <h2 style=\"font-size:19px;color:#1F3D32;margin:20px 0 4px;\">9. Toepasselijk recht<\u002Fh2>\n          <p style=\"margin:0;color:#55524B;\">Op alle behandelingen en boekingen is Nederlands recht van toepassing.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n  <footer style=\"background:#182F27;margin-top:48px;\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:56px 24px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:36px;color:#fff;\">\n      <div>\n        <p style=\"margin:0 0 10px;font-family:'Outfit',sans-serif;font-weight:700;font-size:20px;\">Pedicurecentrum <span style=\"color:#D8C9A3;\">Borne<\u002Fspan><\u002Fp>\n        <p style=\"margin:0 0 4px;color:rgba(255,255,255,.85);\">Aanslagweg 16C, Borne<\u002Fp>\n        <p style=\"margin:0 0 12px;\"><a href=\"tel:+31742661234\" style=\"color:#D8C9A3;\">074 266 1234<\u002Fa><\u002Fp>\n        <p style=\"margin:0;color:rgba(255,255,255,.6);font-size:16px;\">ma t/m vr 8:30 – 17:00<br>do tot 20:00 · za op afspraak<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"height:170px;\"><image-slot id=\"footer-kaart\" placeholder=\"mini-kaart\" radius=\"14\"><\u002Fimage-slot><\u002Fdiv>\n      <div>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;\">\n          <span style=\"border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 16px;font-weight:600;color:rgba(255,255,255,.85);font-size:15px;\">ProVoet<\u002Fspan>\n          <span style=\"border:1px solid rgba(255,255,255,.3);border-radius:99
